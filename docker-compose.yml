services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.interviewbuddy.cloud/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  shorts-compose:
    build: ./shorts-compose
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - OUTPUT_DIR=/app/outputs
      - TOPIC_HISTORY_PATH=/app/data/topic_history.json
      - NODE_OPTIONS=--max-old-space-size=4096
      # Multi-source b-roll resolver (/resolve-broll): real-media sources are
      # routed by scene intent, locally reranked for semantic match, then judged
      # by bounded Claude vision. There is NO AI image/video generation.
      - PEXELS_KEY=${PEXELS_KEY:-}
      - UNSPLASH_KEY=${UNSPLASH_KEY:-}
      - ANTHROPIC_KEY=${ANTHROPIC_KEY:-}
      # Local CLIP coarse reranker. The Hugging Face model is lazily downloaded
      # once and cached under /app/data, which is backed by the persistent
      # shorts_data named volume, so deploys do not repeatedly download it.
      - BROLL_LOCAL_RERANK_ENABLED=${BROLL_LOCAL_RERANK_ENABLED:-true}
      - BROLL_LOCAL_RERANK_MODEL=${BROLL_LOCAL_RERANK_MODEL:-Xenova/clip-vit-base-patch32}
      - BROLL_LOCAL_RERANK_CANDIDATES=${BROLL_LOCAL_RERANK_CANDIDATES:-12}
      - BROLL_LOCAL_RERANK_TIMEOUT_MS=${BROLL_LOCAL_RERANK_TIMEOUT_MS:-18000}
      - BROLL_TEMPLATE_FALLBACK_THRESHOLD=${BROLL_TEMPLATE_FALLBACK_THRESHOLD:-60}
      - HF_CACHE_DIR=${HF_CACHE_DIR:-/app/data/hf-cache}
      # Reliability-first media gates: 78/72 are preferred targets. A real asset
      # below the catastrophic mismatch floor above can be replaced by a
      # deterministic Remotion template instead of showing misleading stock.
      - BROLL_SCORE_THRESHOLD=${BROLL_SCORE_THRESHOLD:-72}
      - BROLL_FIRST_FRAME_THRESHOLD=${BROLL_FIRST_FRAME_THRESHOLD:-78}
      # Paid-vision budget guardrails. Search progressively and stop as soon as
      # an asset clears its quality gate. Scene 0 may use up to 7 evaluations;
      # each supporting scene may use up to 3. The validator permits at most 8
      # content scenes, so 28 is the exact worst-case ceiling (7 + 7*3) rather
      # than an inconsistent cap that can reject a later scene solely because
      # earlier scenes used their legitimate per-scene budgets.
      - BROLL_INITIAL_SEARCH_QUERIES=${BROLL_INITIAL_SEARCH_QUERIES:-2}
      - BROLL_MAX_SEARCH_QUERIES=${BROLL_MAX_SEARCH_QUERIES:-4}
      - BROLL_FIRST_FRAME_MAX_VISION_CALLS=${BROLL_FIRST_FRAME_MAX_VISION_CALLS:-7}
      - BROLL_SUPPORT_MAX_VISION_CALLS=${BROLL_SUPPORT_MAX_VISION_CALLS:-3}
      - BROLL_RUN_MAX_VISION_CALLS=${BROLL_RUN_MAX_VISION_CALLS:-28}
      - BROLL_SCORE_CACHE_TTL_MS=${BROLL_SCORE_CACHE_TTL_MS:-21600000}
      # Competitor outlier mining (/competitors/mine): a YouTube Data API v3 key
      # (public data only - NOT the OAuth analytics credential). If empty, the
      # weekly mine call fails cleanly and the topic generator just runs without
      # competitor signals. Create one in the same Google Cloud project that
      # already has the YouTube Data API enabled: APIs & Services -> Credentials
      # -> Create credentials -> API key.
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      # Optional override for the competitor watchlist: a comma-separated list of
      # @handles and/or UC... channel IDs. Set via a GitHub secret to change the
      # list without a code edit (applies on the next deploy). Empty = use the
      # curated default in shorts-compose/competitors.json.
      - COMPETITOR_CHANNELS=${COMPETITOR_CHANNELS:-}
      # Channel identity: the persistent on-screen wordmark (gold, top of frame).
      - CHANNEL_WORDMARK=${CHANNEL_WORDMARK:-Favourite Facts}
      - CHANNEL_HANDLE=${CHANNEL_HANDLE:-@YourFavouriteDailyFacts}
    volumes:
      # NOTHING bind-mounted from the git checkout dir. deploy.yml checks out
      # with clean:true (`git clean -ffdx`), which deletes any such dir - and
      # deleting a bind-mount source out from under a running container leaves
      # a STALE mount: the path still resolves inside the container but every
      # write fails with ENOENT. That broke outputs (final render copy) and
      # reset topic history. All app-writable paths are named volumes, which
      # live outside the checkout and are immune to git clean - like n8n_data.
      #
      # outputs: ephemeral rendered videos, downloaded via the /outputs HTTP
      # route (nothing on the host reads this dir), then cleaned up per job.
      - shorts_outputs:/app/outputs
      # topic history + Hugging Face model cache: PERSISTENT dedup/retrieval
      # state that must survive every deploy.
      - shorts_data:/app/data
      # No music mount by design: there are currently no music tracks, so the
      # renderer runs without a soundtrack (pickMusicTrack finds none and
      # skips it). To add music later, commit tracks to shorts-compose/music/
      # - the Dockerfile's `COPY . .` bakes them into the image, so they are
      # version-controlled and survive every deploy with no volume needed.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Remotion rendering is memory-intensive (Chromium frame rendering)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  n8n_data:
  shorts_data:
  shorts_outputs:
