services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.interviewbuddy.cloud/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  shorts-compose:
    build: ./shorts-compose
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - OUTPUT_DIR=/app/outputs
      - TOPIC_HISTORY_PATH=/app/data/topic_history.json
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      # outputs are ephemeral rendered videos (downloaded then cleaned up),
      # so a bind mount that git-clean wipes each deploy is fine here.
      - ./shorts-compose/outputs:/app/outputs
      # topic history is PERSISTENT runtime state. It must NOT live in the
      # git checkout dir - deploy.yml checks out with clean:true, which runs
      # `git clean -ffdx` and wipes any bind mount sourced from there (this
      # reset topic dedup history on every deploy). A named volume lives
      # outside the checkout and survives, same as n8n_data.
      - shorts_data:/app/data
      # No music mount by design: there are currently no music tracks, so the
      # renderer runs without a soundtrack (pickMusicTrack finds none and
      # skips it). To add music later, commit tracks to shorts-compose/music/
      # - the Dockerfile's `COPY . .` bakes them into the image, so they are
      # version-controlled and survive every deploy with no volume needed.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Remotion rendering is memory-intensive (Chromium frame rendering)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  n8n_data:
  shorts_data:
