services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=https://n8n.interviewbuddy.cloud/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n

  shorts-compose:
    build: ./shorts-compose
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - OUTPUT_DIR=/app/outputs
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./shorts-compose/outputs:/app/outputs
      - ./shorts-compose/topic_history.json:/app/topic_history.json
      - ./shorts-compose/music:/app/music
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/topic-history"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Remotion rendering is memory-intensive (Chromium frame rendering)
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  n8n_data:
