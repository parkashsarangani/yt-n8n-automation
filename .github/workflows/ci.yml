name: CI

on:
  pull_request:
    branches: [main]

jobs:
  docker-build:
    name: Docker Build (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build shorts-compose image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./shorts-compose
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: shorts-compose:pr-${{ github.event.pull_request.number }}
