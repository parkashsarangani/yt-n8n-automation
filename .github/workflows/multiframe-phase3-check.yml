name: Validate Multi-frame Video Verification V5

on:
  pull_request:
    paths:
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/visualContract.js'
      - 'shorts-compose/semanticReranker.js'
      - 'shorts-compose/visualBudget.js'
      - 'shorts-compose/tests/visual-matching.test.js'
      - 'scripts/build_production_artifacts.py'
      - 'scripts/resolver_v5_runtime.py'
      - 'scripts/visual_matching_v4_workflow.py'
      - '.github/workflows/multiframe-phase3-check.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches: ['agent/**']

jobs:
  multiframe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build authoritative production artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/multiframe-production
          python3 scripts/build_production_artifacts.py --output-dir /tmp/multiframe-production

      - name: Validate final resolver video-verification path
        run: |
          set -euo pipefail
          B=/tmp/multiframe-production/brollResolver.js
          grep -q 'VISUAL_MATCHING_V4' "$B"
          grep -q 'MULTIFRAME_VIDEO_RERANK_V1' "$B"
          grep -q 'sampleVideoContactSheet' "$B"
          grep -q 'V5_VIDEO_SAMPLE_STAGING' "$B"
          grep -q 'downloadVideoSample' "$B"
          grep -q 'VIDEO_SAMPLE_FRAMES' "$B"
          grep -q 'best_frame_indices' "$B"
          grep -q 'normalizeVerifiedFrameIndices' "$B"
          grep -q 'verifiedRangeFromFrameIndices' "$B"
          grep -q 'video_verified_frame_range_missing' "$B"
          grep -q 'verified_frame_indices' "$B"
          grep -q 'materializeVerifiedClip' "$B"
          grep -q 'actual_video_verified' "$B"
          grep -q 'V5_PROOF_MEDIA_TYPE_FILTER' "$B"
          if grep -q 'best_start_sec' "$B" || grep -q 'best_end_sec' "$B"; then
            echo 'free-form model trim timestamps reintroduced' >&2
            exit 1
          fi
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' shorts-compose/visualBudget.js
          node --check "$B"

      - name: Validate generated workflow video-verification telemetry
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/multiframe-production/workflow.json')); names={n['name']:n for n in w['nodes']}
          tag=names['Tag B-roll']['parameters']['jsCode']
          for marker in ['frame_similarity','actual_video_verified','in_point_sec','out_point_sec','verified_frame_indices','asset_semantic_match']:
              assert marker in tag,marker
          resolver=names['Resolve B-roll']['parameters']['jsonBody']
          for marker in ['visual_claim','required_actions','retrieval_scene_count','retrieval_scene_position']:
              assert marker in resolver,marker
          assert 'annotation_plan' not in tag
          print('V5 sampled-frame verification telemetry OK')
          PY

      - name: Exercise sampled-frame range unit tests against production resolver
        run: |
          set -euo pipefail
          cp /tmp/multiframe-production/brollResolver.js shorts-compose/brollResolver.js
          cd shorts-compose
          npm install --no-package-lock --no-audit --no-fund
          node --test tests/visual-matching.test.js tests/resolver-hard-gate.test.js

      - name: Exercise FFmpeg chronological contact sheet
        run: |
          set -euo pipefail
          cd shorts-compose
          node - <<'JS'
          const {execFileSync}=require('child_process'); const fs=require('fs'); const ffmpeg=require('ffmpeg-static');
          const input='/tmp/v5-test.mp4',output='/tmp/v5-sheet.jpg';
          execFileSync(ffmpeg,['-hide_banner','-loglevel','error','-f','lavfi','-i','testsrc=duration=4:size=320x240:rate=24','-pix_fmt','yuv420p','-y',input]);
          execFileSync(ffmpeg,['-hide_banner','-loglevel','error','-i',input,'-vf','fps=3,scale=320:-2:force_original_aspect_ratio=decrease,pad=320:240:(ow-iw)/2:(oh-ih)/2:color=black,tile=4x3:nb_frames=12:padding=3:margin=3','-frames:v','1','-q:v','3','-y',output]);
          if(!fs.statSync(output).size)throw new Error('contact sheet empty');
          console.log('V5 contact sheet OK');
          JS
