name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build and deploy
        run: |
          set -e

          echo "=== Stopping existing shorts-compose (if running) ==="
          docker compose down shorts-compose || true
          # Also kill any orphan container holding port 4000
          docker ps -q --filter "publish=4000" | xargs -r docker stop || true

          echo "=== Ensuring volume mount targets exist as files ==="
          # Docker creates directories if mount source doesn't exist — prevent that
          # If topic_history.json is a directory (from a previous bad mount), remove it
          [ -d ./shorts-compose/topic_history.json ] && rm -rf ./shorts-compose/topic_history.json
          [ -f ./shorts-compose/topic_history.json ] || echo "[]" > ./shorts-compose/topic_history.json
          mkdir -p ./shorts-compose/outputs ./shorts-compose/music

          echo "=== Building shorts-compose ==="
          docker compose build --no-cache shorts-compose

          echo "=== Deploying ==="
          docker compose up -d shorts-compose

      - name: Health check
        run: |
          set -e
          sleep 5
          RETRY=0
          MAX_RETRY=12
          until curl -sf http://localhost:4000/topic-history > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRY ]; then
              echo "ERROR: shorts-compose failed to start after 60s"
              docker compose logs --tail=50 shorts-compose
              exit 1
            fi
            echo "Waiting for shorts-compose to be ready... ($RETRY/$MAX_RETRY)"
            sleep 5
          done
          echo "Health check passed"

      - name: Deploy n8n workflow
        run: |
          echo "=== Deploying n8n workflow ==="
          # Use n8n CLI import which handles the full workflow JSON natively
          # --id flag updates the existing workflow instead of creating a new one
          docker compose exec -T n8n n8n import:workflow --input=/dev/stdin --separate < n8n/workflow.json

          echo "n8n workflow deployed successfully"

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps
