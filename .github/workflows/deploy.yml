name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Pre-production audit
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py

      - name: Build creative-system compose service
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          OPENAI_KEY: ${{ secrets.OPEN_AI_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMPETITOR_CHANNELS: ${{ secrets.COMPETITOR_CHANNELS }}
        run: |
          set -euo pipefail

          echo "=== Validating compose source transforms ==="
          python3 -m py_compile scripts/upgrade-compose-creative-system.py scripts/upgrade-compose-api-budget.py scripts/upgrade-compose-runtime-hardening.py scripts/video_multiframe_phase3.py
          python3 scripts/upgrade-compose-creative-system.py shorts-compose/compose.js
          python3 scripts/upgrade-compose-api-budget.py shorts-compose/compose.js shorts-compose/brollResolver.js
          python3 scripts/upgrade-compose-runtime-hardening.py shorts-compose/brollResolver.js
          grep -q 'CREATIVE_SYSTEM_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET' shorts-compose/brollResolver.js
          grep -q 'PREPROD_BROLL_HARDENING' shorts-compose/brollResolver.js
          grep -q 'RETRIEVAL_RECALL_PHASE2' shorts-compose/brollResolver.js
          grep -q 'SOURCE_QUERY_COMPILER_V1' shorts-compose/brollResolver.js
          grep -q 'fromPixabayVideos' shorts-compose/brollResolver.js
          grep -q 'MULTIFRAME_VIDEO_RERANK_V1' shorts-compose/brollResolver.js
          grep -q 'sampleVideoContactSheet' shorts-compose/brollResolver.js
          grep -q 'frame_similarity' shorts-compose/brollResolver.js
          grep -q 'RUN_MAX_VISION_CALLS' shorts-compose/brollResolver.js
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' shorts-compose/brollResolver.js
          grep -q 'INITIAL_SEARCH_QUERIES' shorts-compose/brollResolver.js
          node --check shorts-compose/compose.js
          node --check shorts-compose/brollResolver.js
          node --check shorts-compose/feedbackLoop.js
          node --check shorts-compose/competitorMining.js

          echo "=== Stopping existing shorts-compose (if running) ==="
          docker compose down shorts-compose || true
          docker ps -q --filter "publish=4000" | xargs -r docker stop || true

          echo "=== Building shorts-compose ==="
          docker compose build --no-cache shorts-compose

          echo "=== Deploying ==="
          docker compose up -d shorts-compose

      - name: Health check
        run: |
          set -euo pipefail
          sleep 5
          RETRY=0
          MAX_RETRY=12
          until curl -sf http://localhost:4000/topic-history > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRY ]; then
              echo "ERROR: shorts-compose failed to start after 60s"
              docker compose logs --tail=50 shorts-compose
              exit 1
            fi
            echo "Waiting for shorts-compose to be ready... ($RETRY/$MAX_RETRY)"
            sleep 5
          done
          echo "Health check passed"

      - name: Build creative-system n8n workflow
        run: |
          set -euo pipefail
          echo "=== Applying quality gate ==="
          python3 -m py_compile scripts/upgrade-viral-shorts.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_quality_gate.json

          echo "=== Applying creative system ==="
          python3 -m py_compile scripts/upgrade-creative-system.py
          python3 scripts/upgrade-creative-system.py /tmp/workflow_quality_gate.json /tmp/workflow_creative_system.json

          echo "=== Applying API budget guardrails ==="
          python3 -m py_compile scripts/upgrade-workflow-api-budget.py
          python3 scripts/upgrade-workflow-api-budget.py /tmp/workflow_creative_system.json /tmp/workflow_api_budget.json

          echo "=== Applying topic latency guardrails ==="
          python3 -m py_compile scripts/upgrade-topic-latency.py
          python3 scripts/upgrade-topic-latency.py /tmp/workflow_api_budget.json /tmp/workflow_topic_latency.json

          echo "=== Applying quality alignment + Anthropic parser/runtime hardening ==="
          python3 -m py_compile scripts/upgrade-anthropic-parser.py scripts/workflow_multiframe_phase3.py
          python3 scripts/upgrade-anthropic-parser.py /tmp/workflow_topic_latency.json /tmp/workflow_quality.json
          python3 -m json.tool /tmp/workflow_quality.json >/dev/null

          echo "=== Verifying generated workflow contract ==="
          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_quality.json'))
          names = {n['name']: n for n in w['nodes']}

          topic = names['Claude: Generate Topic']
          body = topic['parameters']['jsonBody']
          assert 'TOPIC_LATENCY' in body
          assert 'GENERATE 4 DISTINCT candidate topics' in body
          assert 'max_completion_tokens: 6000' in body
          assert topic['parameters']['options']['timeout'] == 120000
          assert topic.get('retryOnFail') is False and topic.get('maxTries') == 1

          commissioner = names['Claude: Commission Topic Shortlist']
          assert commissioner['parameters']['options']['timeout'] == 120000
          assert commissioner.get('retryOnFail') is False and commissioner.get('maxTries') == 1

          visual = names['Claude: Visual Director']
          visual_body = visual['parameters']['jsonBody']
          assert 'QUALITY_ALIGNMENT' in visual_body
          assert 'RETRIEVAL_RECALL_PHASE2' in visual_body
          assert 'pixabay_video' in visual_body and 'pixabay' in visual_body
          assert visual['parameters']['options']['timeout'] == 180000
          assert visual.get('retryOnFail') is False and visual.get('maxTries') == 1
          assert 'reasoning_effort: "none"' in visual_body

          resolver_node = names['Resolve B-roll']
          assert resolver_node['parameters']['options']['timeout'] == 180000
          resolver_body = resolver_node['parameters']['jsonBody']
          assert 'search_queries' in resolver_body and 'first_frame' in resolver_body
          assert 'run_id' in resolver_body and '$execution.id' in resolver_body

          for node_name in ['Parse Topic Pool', 'Extract Generated Topic', 'Parse Draft JSON', 'Validate Final Script']:
              code = names[node_name]['parameters']['jsCode']
              assert 'ANTHROPIC_TEXT_BLOCK_GUARD' in code, node_name
              assert 'LAST_VALID_JSON_OBJECT' in code, node_name
              assert 'content?.[0]?.text' not in code, node_name
              assert 'finish_reason' in code, node_name

          writer_body = names['Claude: Draft Script (Stage 1)']['parameters']['jsonBody']
          assert 'Concept archetype' in writer_body
          validate = names['Validate Final Script']['parameters']['jsCode']
          assert 'visual_plan_quality' in validate
          assert 'needs at least 3 search_queries' in validate
          assert 'rebuiltFullScript' in validate
          assert 'pixabay_video' in validate and 'pixabay' in validate
          tag = names['Tag B-roll']['parameters']['jsCode']
          assert 'compiled_query_plan' in tag
          assert 'MULTIFRAME_TELEMETRY_V1' in tag
          assert 'frame_similarity' in tag and 'frame_sampling_status' in tag
          print('Generated workflow contract OK')
          PY

      - name: Execute parser nodes against synthetic OpenAI responses
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('/tmp/workflow_quality.json', 'utf8'));
          const names = {};
          for (const n of wf.nodes) names[n.name] = n;

          function run(nodeName, input, prior = {}) {
            const fn = new Function('$input', '$', '$execution', names[nodeName].parameters.jsCode);
            const $ = (name) => ({ item: { json: prior[name] || {} } });
            return fn({ first: () => ({ json: input }) }, $, { id: 'deploy-smoke' });
          }
          function assertItem(result, label) {
            if (result === undefined || result === null) throw new Error(label + ': node returned ' + result);
            if (Array.isArray(result)) {
              if (!result.every((x) => x && typeof x === 'object')) throw new Error(label + ': array items must be objects');
            } else if (typeof result !== 'object') {
              throw new Error(label + ': must return an object or array of objects, got ' + typeof result);
            }
          }

          const candidates = Array.from({ length: 4 }, (_, i) => ({
            topic: 'recognizable topic ' + i, archetype: 'looks_fake_but_real', research_query: 'q', first_frame_concept: 'f',
            share_reason: 's', evidence_score: 80, visual_score: 80, share_score: 80, reason: 'r', score: 80,
          }));
          function openaiResponse(text, finishReason = 'stop') {
            return { choices: [{ message: { content: text }, finish_reason: finishReason }] };
          }
          assertItem(run('Parse Topic Pool', openaiResponse(JSON.stringify({ candidates }))), 'Parse Topic Pool happy path');

          const script = { hook: 'a complete hook', scenes: [{ scene_index: 0, point: 'point', narration: 'enough narration' }] };
          const draft = run('Parse Draft JSON', openaiResponse(JSON.stringify(script)));
          assertItem(draft, 'Parse Draft JSON happy path');
          if (!draft || !draft.json || !draft.json.draft) throw new Error('Parse Draft JSON did not return {json:{draft}}');

          const draftCorrected = run('Parse Draft JSON', openaiResponse('{"hook":"bad",]\nWait\n' + JSON.stringify(script)));
          if (draftCorrected.json.draft.hook !== script.hook) throw new Error('Draft parser did not recover corrected JSON');

          console.log('Executable parser smoke tests OK');
          JS

      - name: Deploy n8n workflow
        run: |
          set -euo pipefail
          echo "=== Deploying n8n workflow ==="
          jq '{
            name,
            nodes,
            connections,
            settings: {executionOrder: (.settings.executionOrder // "v1")}
          }' /tmp/workflow_quality.json > /tmp/workflow_deploy.json

          HTTP_STATUS=$(curl -s -o /tmp/n8n_response.json -w "%{http_code}" \
            -X PUT "http://localhost:5678/api/v1/workflows/${{ vars.N8N_WORKFLOW_ID }}" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/workflow_deploy.json)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "n8n workflow deployed successfully (HTTP $HTTP_STATUS)"
          else
            echo "ERROR: n8n workflow deploy failed (HTTP $HTTP_STATUS)"
            cat /tmp/n8n_response.json
            exit 1
          fi

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps
