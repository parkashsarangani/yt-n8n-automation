name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build creative-system V3 compose service
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMPETITOR_CHANNELS: ${{ secrets.COMPETITOR_CHANNELS }}
        run: |
          set -euo pipefail

          echo "=== Validating V3 + V4 source transforms ==="
          python3 -m py_compile scripts/upgrade-compose-v3.py scripts/upgrade-compose-budget-v4.py
          python3 scripts/upgrade-compose-v3.py shorts-compose/compose.js
          python3 scripts/upgrade-compose-budget-v4.py shorts-compose/compose.js shorts-compose/brollResolver.js
          grep -q 'CREATIVE_SYSTEM_V3_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET_V4_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET_V4' shorts-compose/brollResolver.js
          grep -q 'RUN_MAX_VISION_CALLS' shorts-compose/brollResolver.js
          grep -q 'INITIAL_SEARCH_QUERIES' shorts-compose/brollResolver.js
          node --check shorts-compose/compose.js
          node --check shorts-compose/brollResolver.js
          node --check shorts-compose/feedbackLoop.js
          node --check shorts-compose/competitorMining.js

          echo "=== Stopping existing shorts-compose (if running) ==="
          docker compose down shorts-compose || true
          docker ps -q --filter "publish=4000" | xargs -r docker stop || true

          echo "=== Building shorts-compose ==="
          docker compose build --no-cache shorts-compose

          echo "=== Deploying ==="
          docker compose up -d shorts-compose

      - name: Health check
        run: |
          set -euo pipefail
          sleep 5
          RETRY=0
          MAX_RETRY=12
          until curl -sf http://localhost:4000/topic-history > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRY ]; then
              echo "ERROR: shorts-compose failed to start after 60s"
              docker compose logs --tail=50 shorts-compose
              exit 1
            fi
            echo "Waiting for shorts-compose to be ready... ($RETRY/$MAX_RETRY)"
            sleep 5
          done
          echo "Health check passed"

      - name: Build creative-system V6 n8n workflow
        run: |
          set -euo pipefail
          echo "=== Applying viral quality V2 ==="
          python3 -m py_compile scripts/upgrade-viral-shorts.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_v2.json

          echo "=== Applying creative system V3 ==="
          python3 -m py_compile scripts/upgrade-creative-system-v3.py
          python3 scripts/upgrade-creative-system-v3.py /tmp/workflow_v2.json /tmp/workflow_v3.json

          echo "=== Applying API budget V4 ==="
          python3 -m py_compile scripts/upgrade-workflow-budget-v4.py
          python3 scripts/upgrade-workflow-budget-v4.py /tmp/workflow_v3.json /tmp/workflow_v4.json

          echo "=== Applying topic latency V5 ==="
          python3 -m py_compile scripts/upgrade-topic-latency-v5.py
          python3 scripts/upgrade-topic-latency-v5.py /tmp/workflow_v4.json /tmp/workflow_v5.json

          echo "=== Applying Anthropic parser V6 ==="
          python3 -m py_compile scripts/upgrade-anthropic-parser-v6.py
          python3 scripts/upgrade-anthropic-parser-v6.py /tmp/workflow_v5.json /tmp/workflow_quality.json
          python3 -m json.tool /tmp/workflow_quality.json >/dev/null

          grep -q 'VIRAL_QUALITY_V2' /tmp/workflow_quality.json
          grep -q 'CREATIVE_SYSTEM_V3' /tmp/workflow_quality.json
          grep -q 'API_BUDGET_V4' /tmp/workflow_quality.json
          grep -q 'TOPIC_LATENCY_V5' /tmp/workflow_quality.json
          grep -q 'ANTHROPIC_TEXT_BLOCK_V6' /tmp/workflow_quality.json
          grep -q 'Claude: Commission Topic Shortlist (V3)' /tmp/workflow_quality.json
          grep -q 'Claude: Visual Director (V3)' /tmp/workflow_quality.json
          grep -q 'Wikipedia: Research Topic' /tmp/workflow_quality.json
          grep -q 'qualityMinimums' /tmp/workflow_quality.json
          grep -q 'run_id' /tmp/workflow_quality.json

          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_quality.json'))
          names = {n['name']: n for n in w['nodes']}
          topic = names['Claude: Generate Topic']
          body = topic['parameters']['jsonBody']
          assert 'GENERATE 24 DISTINCT candidate topics' in body
          assert 'max_tokens: 6000' in body
          assert 'max_tokens: 8192' not in body
          assert 'max_tokens: 9000' not in body
          assert topic['parameters']['options']['timeout'] == 120000
          assert topic.get('retryOnFail') is False
          assert topic.get('maxTries') == 1
          for node_name in ['Parse Draft JSON', 'Parse Editorial For Visual Director (V3)', 'Validate Final Script']:
              code = names[node_name]['parameters']['jsCode']
              assert 'ANTHROPIC_TEXT_BLOCK_V6' in code, node_name
              assert 'content?.[0]?.text' not in code, node_name
          print('V5 latency + V6 Anthropic parser guardrails OK')
          PY

      - name: Deploy n8n workflow
        run: |
          set -euo pipefail
          echo "=== Deploying n8n workflow ==="
          jq '{
            name,
            nodes,
            connections,
            settings: {executionOrder: (.settings.executionOrder // "v1")}
          }' /tmp/workflow_quality.json > /tmp/workflow_deploy.json

          HTTP_STATUS=$(curl -s -o /tmp/n8n_response.json -w "%{http_code}" \
            -X PUT "http://localhost:5678/api/v1/workflows/${{ vars.N8N_WORKFLOW_ID }}" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/workflow_deploy.json)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "n8n workflow deployed successfully (HTTP $HTTP_STATUS)"
          else
            echo "ERROR: n8n workflow deploy failed (HTTP $HTTP_STATUS)"
            cat /tmp/n8n_response.json
            exit 1
          fi

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps
