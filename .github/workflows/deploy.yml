name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build creative-system compose service
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMPETITOR_CHANNELS: ${{ secrets.COMPETITOR_CHANNELS }}
        run: |
          set -euo pipefail

          echo "=== Validating compose source transforms ==="
          python3 -m py_compile scripts/upgrade-compose-creative-system.py scripts/upgrade-compose-api-budget.py
          python3 scripts/upgrade-compose-creative-system.py shorts-compose/compose.js
          python3 scripts/upgrade-compose-api-budget.py shorts-compose/compose.js shorts-compose/brollResolver.js
          grep -q 'CREATIVE_SYSTEM_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET_COMPOSE' shorts-compose/compose.js
          grep -q 'API_BUDGET' shorts-compose/brollResolver.js
          grep -q 'RUN_MAX_VISION_CALLS' shorts-compose/brollResolver.js
          grep -q 'INITIAL_SEARCH_QUERIES' shorts-compose/brollResolver.js
          node --check shorts-compose/compose.js
          node --check shorts-compose/brollResolver.js
          node --check shorts-compose/feedbackLoop.js
          node --check shorts-compose/competitorMining.js

          echo "=== Stopping existing shorts-compose (if running) ==="
          docker compose down shorts-compose || true
          docker ps -q --filter "publish=4000" | xargs -r docker stop || true

          echo "=== Building shorts-compose ==="
          docker compose build --no-cache shorts-compose

          echo "=== Deploying ==="
          docker compose up -d shorts-compose

      - name: Health check
        run: |
          set -euo pipefail
          sleep 5
          RETRY=0
          MAX_RETRY=12
          until curl -sf http://localhost:4000/topic-history > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRY ]; then
              echo "ERROR: shorts-compose failed to start after 60s"
              docker compose logs --tail=50 shorts-compose
              exit 1
            fi
            echo "Waiting for shorts-compose to be ready... ($RETRY/$MAX_RETRY)"
            sleep 5
          done
          echo "Health check passed"

      - name: Build creative-system n8n workflow
        run: |
          set -euo pipefail
          echo "=== Applying quality gate ==="
          python3 -m py_compile scripts/upgrade-viral-shorts.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_quality_gate.json

          echo "=== Applying creative system ==="
          python3 -m py_compile scripts/upgrade-creative-system.py
          python3 scripts/upgrade-creative-system.py /tmp/workflow_quality_gate.json /tmp/workflow_creative_system.json

          echo "=== Applying API budget guardrails ==="
          python3 -m py_compile scripts/upgrade-workflow-api-budget.py
          python3 scripts/upgrade-workflow-api-budget.py /tmp/workflow_creative_system.json /tmp/workflow_api_budget.json

          echo "=== Applying topic latency guardrails ==="
          python3 -m py_compile scripts/upgrade-topic-latency.py
          python3 scripts/upgrade-topic-latency.py /tmp/workflow_api_budget.json /tmp/workflow_topic_latency.json

          echo "=== Applying Anthropic parser hardening ==="
          python3 -m py_compile scripts/upgrade-anthropic-parser.py
          python3 scripts/upgrade-anthropic-parser.py /tmp/workflow_topic_latency.json /tmp/workflow_quality.json
          python3 -m json.tool /tmp/workflow_quality.json >/dev/null

          grep -q 'QUALITY_GATE' /tmp/workflow_quality.json
          grep -q 'CREATIVE_SYSTEM' /tmp/workflow_quality.json
          grep -q 'API_BUDGET' /tmp/workflow_quality.json
          grep -q 'TOPIC_LATENCY' /tmp/workflow_quality.json
          grep -q 'ANTHROPIC_TEXT_BLOCK_GUARD' /tmp/workflow_quality.json
          grep -q 'Claude: Commission Topic Shortlist' /tmp/workflow_quality.json
          grep -q 'Claude: Visual Director' /tmp/workflow_quality.json
          grep -q 'Wikipedia: Research Topic' /tmp/workflow_quality.json
          grep -q 'qualityMinimums' /tmp/workflow_quality.json
          grep -q 'run_id' /tmp/workflow_quality.json

          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_quality.json'))
          names = {n['name']: n for n in w['nodes']}
          topic = names['Claude: Generate Topic']
          body = topic['parameters']['jsonBody']
          assert 'GENERATE 12 DISTINCT candidate topics' in body
          assert 'max_tokens: 6000' in body
          assert 'max_tokens: 8192' not in body
          assert 'max_tokens: 9000' not in body
          assert topic['parameters']['options']['timeout'] == 120000
          assert topic.get('retryOnFail') is False
          assert topic.get('maxTries') == 1
          for node_name in ['Parse Draft JSON', 'Parse Editorial For Visual Director', 'Validate Final Script']:
              code = names[node_name]['parameters']['jsCode']
              assert 'ANTHROPIC_TEXT_BLOCK_GUARD' in code, node_name
              assert 'content?.[0]?.text' not in code, node_name
          pool_code = names['Parse Topic Pool']['parameters']['jsCode']
          assert 'try {' in pool_code or 'try{' in pool_code, 'Parse Topic Pool must guard JSON.parse'
          assert 'stop_reason' in pool_code, 'Parse Topic Pool must diagnose max_tokens truncation'
          writer_body = names['Claude: Draft Script (Stage 1)']['parameters']['jsonBody']
          assert 'Concept archetype' in writer_body, 'archetype context must reach the script writer'
          print('Topic latency + Anthropic parser guardrails OK')
          PY

      - name: Execute parser nodes against synthetic Claude responses
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('/tmp/workflow_quality.json', 'utf8'));
          const names = {};
          for (const n of wf.nodes) names[n.name] = n;

          function run(nodeName, input) {
            const fn = new Function('$input', names[nodeName].parameters.jsCode);
            return fn({ first: () => ({ json: input }) });
          }
          function assertItem(result, label) {
            if (result === undefined || result === null) throw new Error(label + ': node returned ' + result + ' instead of an item - string-presence CI checks miss this, execution does not');
            if (Array.isArray(result)) {
              if (!result.every((x) => x && typeof x === 'object')) throw new Error(label + ': array items must be objects');
            } else if (typeof result !== 'object') {
              throw new Error(label + ': must return an object or array of objects, got ' + typeof result);
            }
          }

          const candidates = Array.from({ length: 9 }, (_, i) => ({
            topic: 't' + i, archetype: 'looks_fake_but_real', research_query: 'q', first_frame_concept: 'f',
            share_reason: 's', evidence_score: 80, visual_score: 80, share_score: 80, reason: 'r', score: 80,
          }));
          assertItem(run('Parse Topic Pool', { content: [{ type: 'text', text: JSON.stringify({ candidates }) }], stop_reason: 'end_turn' }), 'Parse Topic Pool happy path');

          assertItem(run('Parse Draft JSON', { content: [{ type: 'text', text: '{"hook":"h"}' }], stop_reason: 'end_turn' }), 'Parse Draft JSON happy path');

          const editorial = run('Parse Editorial For Visual Director', { content: [{ type: 'text', text: '{"hook":"h","scenes":[]}' }], stop_reason: 'end_turn' });
          assertItem(editorial, 'Parse Editorial For Visual Director happy path');
          if (!editorial || !editorial.json || !editorial.json.script) throw new Error('Parse Editorial For Visual Director did not return {json:{script}}');

          console.log('Executable node smoke tests OK (Parse Topic Pool, Parse Draft JSON, Parse Editorial For Visual Director)');
          JS

      - name: Deploy n8n workflow
        run: |
          set -euo pipefail
          echo "=== Deploying n8n workflow ==="
          jq '{
            name,
            nodes,
            connections,
            settings: {executionOrder: (.settings.executionOrder // "v1")}
          }' /tmp/workflow_quality.json > /tmp/workflow_deploy.json

          HTTP_STATUS=$(curl -s -o /tmp/n8n_response.json -w "%{http_code}" \
            -X PUT "http://localhost:5678/api/v1/workflows/${{ vars.N8N_WORKFLOW_ID }}" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/workflow_deploy.json)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "n8n workflow deployed successfully (HTTP $HTTP_STATUS)"
          else
            echo "ERROR: n8n workflow deploy failed (HTTP $HTTP_STATUS)"
            cat /tmp/n8n_response.json
            exit 1
          fi

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps
