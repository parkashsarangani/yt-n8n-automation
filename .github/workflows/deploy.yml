name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Build exact production artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/yt-shorts-production
          python3 -m py_compile scripts/build_production_artifacts.py scripts/preprod-audit.py
          python3 scripts/build_production_artifacts.py --output-dir /tmp/yt-shorts-production
          python3 -m json.tool /tmp/yt-shorts-production/workflow.json >/dev/null
          cat /tmp/yt-shorts-production/manifest.json

      - name: Pre-production audit
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py

      - name: Validate and deploy compose plus LLM routing services
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          OPENAI_KEY: ${{ secrets.OPEN_AI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          COMPETITOR_CHANNELS: ${{ secrets.COMPETITOR_CHANNELS }}
          FREELLMAPI_ENCRYPTION_KEY: ${{ secrets.FREELLMAPI_ENCRYPTION_KEY }}
          FREELLMAPI_API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          FREELLMAPI_CONFIG_JSON: ${{ secrets.FREELLMAPI_CONFIG_JSON }}
          LLM_ROUTER_MODE: ${{ vars.LLM_ROUTER_MODE || 'freellmapi' }}
          LLM_ROUTER_FAIL_OPEN_TO_DIRECT: ${{ vars.LLM_ROUTER_FAIL_OPEN_TO_DIRECT || 'true' }}
          FREELLMAPI_TEXT_MODEL: ${{ vars.FREELLMAPI_TEXT_MODEL || 'auto:smart' }}
          FREELLMAPI_VISION_MODEL: ${{ vars.FREELLMAPI_VISION_MODEL || 'auto:smart' }}
        run: |
          set -euo pipefail

          echo "=== Installing exact generated runtime artifacts ==="
          cp /tmp/yt-shorts-production/compose.js shorts-compose/compose.js
          cp /tmp/yt-shorts-production/brollResolver.js shorts-compose/brollResolver.js

          grep -q 'VISUAL_MATCHING_V4_COMPOSE' shorts-compose/compose.js
          grep -q 'NON_BLOCKING_FINAL_QA' shorts-compose/compose.js
          grep -q 'publishing anyway' shorts-compose/compose.js
          ! grep -q 'Final visual QA rejected catastrophic render defects' shorts-compose/compose.js
          grep -q 'V5_ALWAYS_PUBLISH_BEST_AVAILABLE' shorts-compose/brollResolver.js
          grep -q 'best_available_below_quality_target' shorts-compose/brollResolver.js
          grep -q 'no_technically_usable_candidate' shorts-compose/brollResolver.js
          ! grep -q 'V5_PROOF_MEDIA_TYPE_FILTER' shorts-compose/brollResolver.js
          ! grep -q 'reason: state.budget_exhausted || "below_semantic_quality_gate"' shorts-compose/brollResolver.js
          grep -q 'deterministic_template_fallback' shorts-compose/brollResolver.js
          grep -q 'RESOLVE_DEADLINE_MS' shorts-compose/brollResolver.js
          ! grep -q 'annotation_plan' shorts-compose/brollResolver.js
          grep -q 'BROLL_BUDGET_STATE_PATH' shorts-compose/visualBudget.js
          grep -q 'hard_failed' shorts-compose/finalVisualQa.js
          node --check shorts-compose/compose.js
          node --check shorts-compose/brollResolver.js
          node --check shorts-compose/visualContract.js
          node --check shorts-compose/visualBudget.js
          node --check shorts-compose/semanticReranker.js
          node --check shorts-compose/clipLibrary.js
          node --check shorts-compose/finalVisualQa.js
          node --check shorts-compose/llmRouting.js
          node --check shorts-compose/llmGateway.js

          echo "=== Building shorts-compose and internal LLM gateway ==="
          docker compose build shorts-compose llm-gateway

          # FreeLLMAPI is optional at deployment time so adding this PR cannot
          # take publishing down before its provider keys are configured. In
          # freellmapi mode the gateway automatically uses direct OpenAI as an
          # emergency fallback when the local free router is unavailable.
          if [ -n "${FREELLMAPI_ENCRYPTION_KEY:-}" ]; then
            echo "=== Starting pinned FreeLLMAPI v0.6.9 ==="
            docker compose pull freellmapi
            docker compose up -d freellmapi
          else
            echo "WARNING: FREELLMAPI_ENCRYPTION_KEY is not configured; FreeLLMAPI container will not be started. Direct fail-open remains available."
          fi

          echo "=== Deploying LLM gateway and shorts-compose ==="
          docker compose up -d --no-deps llm-gateway shorts-compose
          echo "LLM routing mode: ${LLM_ROUTER_MODE}; fail-open-to-direct: ${LLM_ROUTER_FAIL_OPEN_TO_DIRECT}"

      - name: Health check
        env:
          FREELLMAPI_ENCRYPTION_KEY: ${{ secrets.FREELLMAPI_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          RETRY=0
          MAX_RETRY=12
          until curl -sf http://localhost:4000/topic-history > /dev/null 2>&1; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRY ]; then
              echo "ERROR: shorts-compose failed to start after 60s"
              docker compose logs --tail=50 shorts-compose
              exit 1
            fi
            echo "Waiting for shorts-compose to be ready... ($RETRY/$MAX_RETRY)"
            sleep 5
          done

          docker compose exec -T llm-gateway node -e "fetch('http://127.0.0.1:3100/health').then(async r=>{if(!r.ok)process.exit(1);console.log(await r.text())}).catch(e=>{console.error(e);process.exit(1)})"

          if [ -n "${FREELLMAPI_ENCRYPTION_KEY:-}" ]; then
            until curl -sf http://127.0.0.1:3001/api/ping > /dev/null 2>&1; do
              RETRY=$((RETRY + 1))
              if [ $RETRY -ge $MAX_RETRY ]; then
                echo "ERROR: FreeLLMAPI was configured but failed its health check"
                docker compose logs --tail=80 freellmapi
                exit 1
              fi
              sleep 5
            done
          fi
          echo "Health checks passed"

      - name: Verify generated workflow contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/yt-shorts-production/workflow.json'))
          names={n['name']:n for n in w['nodes']}
          assert w.get('meta',{}).get('visual_matching_version')=='4'
          assert w.get('meta',{}).get('production_build_version')=='5'
          assert w.get('meta',{}).get('compose_service_transport')=='docker_internal'
          assert w.get('meta',{}).get('llm_gateway_transport')=='docker_internal'
          assert int(w.get('meta',{}).get('llm_gateway_routed_nodes',0)) >= 1
          assert names['Resolve B-roll']['parameters']['url'].startswith('http://shorts-compose:4000/')
          assert names['Start Compose Job']['parameters']['url'].startswith('http://shorts-compose:4000/')
          assert 'publication_description' in names['Merge By scene_index (not position)']['parameters']['jsCode']
          assert 'useanimations.com (CC BY 4.0)' in names['Merge By scene_index (not position)']['parameters']['jsCode']
          tag=names['Tag B-roll']['parameters']['jsCode']
          assert "r.type==='template'" in tag and 'annotation_plan' not in tag
          assert 'quality_gate_passed' in tag and 'selection_reason' in tag
          visual=names['Claude: Visual Director']['parameters']['jsonBody']
          assert 'Do NOT request callout boxes' in visual and 'locate callout boxes' not in visual

          routed=0
          for node in w['nodes']:
            url=node.get('parameters',{}).get('url')
            if isinstance(url,str) and ('api.openai.com' in url or 'api.anthropic.com' in url):
              raise AssertionError(f"provider bypass remains in {node.get('name')}: {url}")
            if isinstance(url,str) and url.startswith('http://llm-gateway:3100/v1/'):
              routed += 1
              assert not node.get('credentials'), node.get('name')
          assert routed == int(w['meta']['llm_gateway_routed_nodes'])
          print(f'Generated production workflow contract OK; {routed} LLM nodes use internal gateway')
          PY

      - name: Execute parser nodes against synthetic OpenAI-compatible responses
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('/tmp/yt-shorts-production/workflow.json', 'utf8'));
          const names = {}; for (const n of wf.nodes) names[n.name] = n;
          function run(nodeName, input, prior = {}) {
            const fn = new Function('$input', '$', '$execution', names[nodeName].parameters.jsCode);
            const $ = (name) => ({ item: { json: prior[name] || {} } });
            return fn({ first: () => ({ json: input }) }, $, { id: 'deploy-smoke' });
          }
          function assertItem(result, label) {
            if (result === undefined || result === null) throw new Error(label + ': node returned ' + result);
            if (Array.isArray(result)) {
              if (!result.every((x) => x && typeof x === 'object')) throw new Error(label + ': array items must be objects');
            } else if (typeof result !== 'object') throw new Error(label + ': must return an object or array');
          }
          const candidates = Array.from({ length: 4 }, (_, i) => ({
            topic: 'recognizable topic ' + i, archetype: 'looks_fake_but_real', research_query: 'q', first_frame_concept: 'f',
            share_reason: 's', evidence_score: 80, visual_score: 80, share_score: 80, reason: 'r', score: 80,
          }));
          const response = (text, finish_reason='stop') => ({ choices: [{ message: { content: text }, finish_reason }] });
          assertItem(run('Parse Topic Pool', response(JSON.stringify({ candidates }))), 'Parse Topic Pool');
          const script = { hook: 'a complete hook', scenes: [{ scene_index: 0, point: 'point', narration: 'enough narration' }] };
          assertItem(run('Parse Draft JSON', response(JSON.stringify(script))), 'Parse Draft JSON');
          console.log('Executable parser smoke tests OK');
          JS

      - name: Deploy n8n workflow
        run: |
          set -euo pipefail
          jq '{
            name,
            nodes,
            connections,
            settings: {executionOrder: (.settings.executionOrder // "v1")}
          }' /tmp/yt-shorts-production/workflow.json > /tmp/workflow_deploy.json

          HTTP_STATUS=$(curl -s -o /tmp/n8n_response.json -w "%{http_code}" \
            -X PUT "http://localhost:5678/api/v1/workflows/${{ vars.N8N_WORKFLOW_ID }}" \
            -H "X-N8N-API-KEY: ${{ secrets.N8N_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/workflow_deploy.json)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "n8n workflow deployed successfully (HTTP $HTTP_STATUS)"
          else
            echo "ERROR: n8n workflow deploy failed (HTTP $HTTP_STATUS)"
            cat /tmp/n8n_response.json
            exit 1
          fi

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="
          docker compose ps
