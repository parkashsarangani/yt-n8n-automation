name: Validate Workflow Contracts

on:
  pull_request:
    paths:
      - 'scripts/workflow_contracts.py'
      - 'scripts/workflow_guardrails.py'
      - 'scripts/upgrade_quality_alignment.py'
      - 'scripts/upgrade-topic-latency.py'
      - 'scripts/upgrade-anthropic-parser.py'
      - 'scripts/preprod-audit.py'
      - '.github/workflows/workflow-contracts-check.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'scripts/workflow_contracts.py'
      - 'scripts/workflow_guardrails.py'
      - 'scripts/upgrade_quality_alignment.py'
      - 'scripts/upgrade-topic-latency.py'
      - 'scripts/upgrade-anthropic-parser.py'
      - 'scripts/preprod-audit.py'
      - '.github/workflows/workflow-contracts-check.yml'

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared contract modules
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/workflow_contracts.py \
            scripts/workflow_guardrails.py \
            scripts/upgrade_quality_alignment.py
      - name: Execute production preflight
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py
