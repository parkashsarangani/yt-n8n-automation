name: Validate Retrieval Telemetry

on:
  pull_request:
    paths:
      - 'scripts/upgrade-compose-runtime-hardening.py'
      - 'scripts/upgrade_quality_alignment.py'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/visualBudget.js'
      - 'shorts-compose/clipLibrary.js'
      - 'shorts-compose/tests/retrieval-telemetry.test.js'
      - '.github/workflows/retrieval-telemetry-check.yml'
  push:
    branches: ['agent/**']

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify V4 workflow telemetry payload
        run: |
          set -euo pipefail
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/t1.json
          python3 scripts/upgrade-creative-system.py /tmp/t1.json /tmp/t2.json
          python3 scripts/visual_matching_v4_workflow.py /tmp/t2.json /tmp/t2v4.json
          python3 scripts/upgrade-workflow-api-budget.py /tmp/t2v4.json /tmp/t3.json
          python3 scripts/upgrade-topic-latency.py /tmp/t3.json /tmp/t4.json
          python3 scripts/upgrade-anthropic-parser.py /tmp/t4.json /tmp/final.json
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/final.json')); names={n['name']:n for n in w['nodes']}
          tag=names['Tag B-roll']['parameters']['jsCode']; merge=names['Merge By scene_index (not position)']['parameters']['jsCode']
          for marker in ['asset_semantic_match','asset_entity_match','asset_action_match','asset_relationship_match','asset_local_similarity','asset_frame_similarity','actual_video_verified','library_hit']:
              assert marker in tag,marker
          for marker in ['asset_semantic_match','asset_entity_match','asset_action_match','asset_relationship_match','actual_video_verified']:
              assert marker in merge,marker
          print('V4 semantic telemetry contract OK')
          PY

      - name: Verify resolver telemetry and budget state
        run: |
          set -euo pipefail
          cp shorts-compose/compose.js /tmp/compose.js
          cp shorts-compose/brollResolver.js /tmp/broll.js
          python3 scripts/upgrade-compose-creative-system.py /tmp/compose.js
          python3 scripts/upgrade-compose-api-budget.py /tmp/compose.js /tmp/broll.js
          python3 scripts/upgrade-compose-runtime-hardening.py /tmp/broll.js
          for marker in semantic_match entity_match action_match relationship_match local_similarity frame_similarity search_rounds queries_tried library_hit; do grep -q "$marker" /tmp/broll.js; done
          for marker in RUN_MAX_VISION_CALLS run_remaining scene_remaining; do grep -q "$marker" shorts-compose/visualBudget.js; done
          grep -q 'getBudgetState' /tmp/broll.js
          node --check /tmp/broll.js
          node --check shorts-compose/visualBudget.js

      - name: Test existing telemetry normalization
        run: |
          set -euo pipefail
          node --test shorts-compose/tests/retrieval-telemetry.test.js
