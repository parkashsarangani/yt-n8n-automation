name: Validate Retrieval Telemetry V5

on:
  pull_request:
    paths:
      - 'scripts/build_production_artifacts.py'
      - 'scripts/resolver_v5_runtime.py'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/visualBudget.js'
      - 'shorts-compose/clipLibrary.js'
      - 'shorts-compose/tests/retrieval-telemetry.test.js'
      - 'shorts-compose/tests/visual-budget-persistence.test.js'
      - '.github/workflows/retrieval-telemetry-check.yml'
  push:
    branches: ['agent/**']

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build authoritative production artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/telemetry-production
          python3 scripts/build_production_artifacts.py --output-dir /tmp/telemetry-production

      - name: Verify workflow telemetry payload
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/telemetry-production/workflow.json')); names={n['name']:n for n in w['nodes']}
          tag=names['Tag B-roll']['parameters']['jsCode']; merge=names['Merge By scene_index (not position)']['parameters']['jsCode']
          for marker in ['asset_semantic_match','asset_entity_match','asset_action_match','asset_relationship_match','asset_local_similarity','asset_frame_similarity','actual_video_verified','library_hit']:
              assert marker in tag,marker
          for marker in ['asset_semantic_match','asset_entity_match','asset_action_match','asset_relationship_match','actual_video_verified','_attribution','publicationDescription']:
              assert marker in merge,marker
          assert 'annotation_plan' not in tag
          print('V5 semantic telemetry contract OK')
          PY

      - name: Verify resolver telemetry and durable budget state
        run: |
          set -euo pipefail
          B=/tmp/telemetry-production/brollResolver.js
          for marker in semantic_match entity_match action_match relationship_match local_similarity frame_similarity search_rounds queries_tried library_hit vision_call_limit failure_reasons; do grep -q "$marker" "$B"; done
          for marker in RUN_MAX_VISION_CALLS run_remaining scene_remaining durable_state STATE_PATH; do grep -q "$marker" shorts-compose/visualBudget.js; done
          grep -q 'getBudgetState' "$B"
          grep -q 'RESOLVER_V5_RUNTIME' "$B"
          node --check "$B"
          node --check shorts-compose/visualBudget.js

      - name: Test telemetry normalization and durable budgets
        run: |
          set -euo pipefail
          node --test shorts-compose/tests/retrieval-telemetry.test.js shorts-compose/tests/visual-budget-persistence.test.js
