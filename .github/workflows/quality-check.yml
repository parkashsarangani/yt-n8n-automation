name: Validate Shorts Creative System

on:
  pull_request:
    paths:
      - 'n8n/workflow.json'
      - 'scripts/**'
      - 'shorts-compose/**'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'
  push:
    branches: ['agent/**']
    paths:
      - 'n8n/workflow.json'
      - 'scripts/**'
      - 'shorts-compose/**'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build exact production artifacts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_production_artifacts.py scripts/resolver_v5_runtime.py scripts/visual_matching_v4_compose.py scripts/visual_matching_v4_workflow.py scripts/preprod-audit.py
          rm -rf /tmp/production-a /tmp/production-b
          python3 scripts/build_production_artifacts.py --output-dir /tmp/production-a
          python3 scripts/build_production_artifacts.py --output-dir /tmp/production-b
          cmp /tmp/production-a/manifest.json /tmp/production-b/manifest.json
          python3 -m json.tool /tmp/production-a/workflow.json >/dev/null
          cat /tmp/production-a/manifest.json

      - name: Verify production workflow policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/production-a/workflow.json'))
          names={n['name']:n for n in w['nodes']}
          assert w.get('meta',{}).get('visual_matching_version')=='4'
          assert w.get('meta',{}).get('production_build_version')=='5'
          assert w.get('meta',{}).get('compose_service_transport')=='docker_internal'
          visual=names['Claude: Visual Director']['parameters']['jsonBody']
          assert 'VISUAL_MATCHING_V4' in visual
          assert 'Do NOT request callout boxes' in visual
          assert 'visually locate callout boxes' not in visual
          resolver=names['Resolve B-roll']
          assert resolver['parameters']['url'].startswith('http://shorts-compose:4000/')
          assert resolver['parameters']['options']['timeout']==160000
          rb=resolver['parameters']['jsonBody']
          for marker in ['retrieval_scene_count','retrieval_scene_position','run_id','$execution.id','visual_claim','required_entities','required_actions','required_relationships']:
              assert marker in rb, marker
          tag=names['Tag B-roll']['parameters']['jsCode']
          for marker in ["r.type==='template'",'deterministic fallback','verified-real scene','asset_semantic_match','verified_frame_indices','quality_gate_passed','selection_reason']:
              assert marker in tag, marker
          assert 'annotation_plan' not in tag and 'annotations:' not in tag
          merge=names['Merge By scene_index (not position)']['parameters']['jsCode']
          assert '_attribution' in merge
          assert 'publicationDescription' in merge
          assert 'useanimations.com (CC BY 4.0)' in merge
          assert names['YouTube: Upload Draft']['parameters']['options']['description'].endswith('publication_description }}')
          assert 'publication_description' in names['Disclose AI-Generated Content']['parameters']['jsonBody']
          for node in w['nodes']:
              url=node.get('parameters',{}).get('url')
              if isinstance(url,str) and 'shorts.interviewbuddy.cloud' in url:
                  raise AssertionError(f"compose-service call still uses public proxy: {node.get('name')} -> {url}")
          print('production workflow policy OK')
          PY

      - name: Verify compose and resolver hardening
        run: |
          set -euo pipefail
          C=/tmp/production-a/compose.js
          B=/tmp/production-a/brollResolver.js
          node --check "$C"
          node --check "$B"
          node --check shorts-compose/visualContract.js
          node --check shorts-compose/visualBudget.js
          node --check shorts-compose/finalVisualQa.js
          grep -q 'NON_BLOCKING_FINAL_QA' "$C"
          grep -q 'PRODUCTION_BT709_RANGE_NORMALIZATION' "$C"
          grep -q '"-color_range", "tv"' "$C"
          grep -q 'publishing anyway' "$C"
          ! grep -q 'Final visual QA rejected catastrophic render defects' "$C"
          for marker in candidatePassesGate deterministic_template_fallback RESOLVE_DEADLINE_MS RESOLVER_V5_RUNTIME V5_VIDEO_SAMPLE_STAGING V5_FULL_GATE_EARLY_ACCEPT V5_ALWAYS_PUBLISH_BEST_AVAILABLE best_available_below_quality_target no_technically_usable_candidate downloadVideoSample video_contact_sheet_ffmpeg_failed quality_gate_passed selection_reason; do grep -q "$marker" "$B"; done
          ! grep -q 'V5_PROOF_MEDIA_TYPE_FILTER' "$B"
          ! grep -q 'reason: state.budget_exhausted || "below_semantic_quality_gate"' "$B"
          ! grep -q 'normalizeAnnotationPlan' "$B"
          ! grep -q 'annotation_plan' "$B"
          grep -q 'BROLL_BUDGET_STATE_PATH' shorts-compose/visualBudget.js
          grep -q 'durable_state: true' shorts-compose/visualBudget.js
          grep -q 'debug_artifact' shorts-compose/finalVisualQa.js
          grep -q 'caption_integrity' shorts-compose/finalVisualQa.js
          grep -q 'hard_failed' shorts-compose/finalVisualQa.js
          for f in shorts-compose/remotion/src/compositions/MapVisual.tsx shorts-compose/remotion/src/compositions/TimelineVisual.tsx shorts-compose/remotion/src/compositions/DiagramVisual.tsx shorts-compose/remotion/src/compositions/AnnotatedReal.tsx; do test -s "$f"; done
          ! grep -q 'Callouts are positioned from visual verification' shorts-compose/remotion/src/compositions/AnnotatedReal.tsx

      - name: Provision production media runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install production-equivalent Node and Remotion dependencies
        run: |
          set -euo pipefail
          cd shorts-compose
          npm install --no-package-lock --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs');
          const p = require('ffmpeg-static');
          const real = fs.realpathSync(p);
          if (real !== '/usr/bin/ffmpeg') throw new Error(`ffmpeg-static path did not select system FFmpeg: ${real}`);
          console.log(`FFmpeg runtime OK: ${p} -> ${real}`);
          NODE
          npm --prefix remotion install --no-package-lock --no-audit --no-fund
          cd remotion
          RSPACK_VER="$(node -p "require('@rspack/binding/package.json').version")"
          npm install --no-package-lock --no-audit --no-fund --no-save "@rspack/binding-linux-x64-gnu@${RSPACK_VER}"
          node -e "require('@rspack/binding'); console.log('rspack binding OK')"

      - name: Run regression tests on exact deploy artifacts
        env:
          CREATIVE_SYSTEM_EXPECT_PREFLIGHT: 'true'
        run: |
          set -euo pipefail
          cp /tmp/production-a/compose.js shorts-compose/compose.js
          cp /tmp/production-a/brollResolver.js shorts-compose/brollResolver.js
          cd shorts-compose
          node --check compose.js
          node --check brollResolver.js
          npm test

      - name: Run comprehensive pre-production audit
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py