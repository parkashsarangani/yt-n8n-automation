name: Validate Shorts Creative System

on:
  pull_request:
    paths:
      - 'n8n/workflow.json'
      - 'scripts/**'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'scripts/visual_matching_v4_compose.py'
      - 'shorts-compose/**'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'
  push:
    branches: ['agent/**']
    paths:
      - 'n8n/workflow.json'
      - 'scripts/**'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'scripts/visual_matching_v4_compose.py'
      - 'shorts-compose/**'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply production workflow upgrades
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-viral-shorts.py scripts/upgrade-creative-system.py scripts/visual_matching_v4_workflow.py scripts/upgrade-workflow-api-budget.py scripts/upgrade-topic-latency.py scripts/upgrade_quality_alignment.py scripts/upgrade-anthropic-parser.py scripts/preprod-audit.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/w1.json
          python3 scripts/upgrade-creative-system.py /tmp/w1.json /tmp/w2.json
          python3 scripts/visual_matching_v4_workflow.py /tmp/w2.json /tmp/w2v4.json
          python3 scripts/upgrade-workflow-api-budget.py /tmp/w2v4.json /tmp/w3.json
          python3 scripts/upgrade-topic-latency.py /tmp/w3.json /tmp/w4.json
          python3 scripts/upgrade-anthropic-parser.py /tmp/w4.json /tmp/workflow_final.json
          python3 -m json.tool /tmp/workflow_final.json >/dev/null

      - name: Verify V4 workflow contract
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/workflow_final.json')); names={n['name']:n for n in w['nodes']}; c=w['connections']
          assert w.get('meta',{}).get('visual_matching_version')=='4'
          def first(src): return c[src]['main'][0][0]['node']
          assert first('Claude: Generate Topic')=='Parse Topic Pool'
          assert first('Parse Draft JSON')=='Claude: Visual Director'
          assert first('Claude: Visual Director')=='Validate Final Script'
          visual=names['Claude: Visual Director']; vb=visual['parameters']['jsonBody']
          assert visual['parameters']['options']['timeout']==180000 and visual.get('retryOnFail') is False and visual.get('maxTries')==1
          assert 'reasoning_effort: "none"' in vb and 'VISUAL_MATCHING_V4' in vb
          for f in ['visual_claim','required_entities','required_actions','required_relationships','forbidden_visuals','visual_proof_mode','OVERALL SELECTED TOPIC','map=>template + map','timeline=>template + timeline','diagram=>template + diagram','annotated_real MUST remain a real-media retrieval scene']:
              assert f in vb,f
          resolver=names['Resolve B-roll']; rb=resolver['parameters']['jsonBody']
          assert resolver['parameters']['options']['timeout']==180000
          for f in ['search_queries','first_frame','run_id','$execution.id','visual_claim','required_entities','required_actions','required_relationships','forbidden_visuals','visual_proof_mode','narration','global_subject']:
              assert f in rb,f
          validate=names['Validate Final Script']['parameters']['jsCode']
          for f in ['VISUAL_MATCHING_V4 contract gate','needs at least 3 search_queries','rebuiltFullScript','deterministicModes','expectedTemplate','map requires template_data.locations','timeline requires at least two events','diagram requires at least two nodes']:
              assert f in validate,f
          tag=names['Tag B-roll']['parameters']['jsCode']
          for f in ['asset_semantic_match','asset_entity_match','asset_action_match','asset_relationship_match','actual_video_verified','frame_similarity','verified_frame_indices','annotation_plan',"template_name='annotated_real'"]:
              assert f in tag,f
          for n in ['Parse Topic Pool','Extract Generated Topic','Parse Draft JSON','Validate Final Script']:
              code=names[n]['parameters']['jsCode']; assert 'ANTHROPIC_TEXT_BLOCK_GUARD' in code and 'LAST_VALID_JSON_OBJECT' in code and 'content?.[0]?.text' not in code
          print('V4 workflow contract OK')
          PY

      - name: Validate compose and resolver production transforms
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-compose-creative-system.py scripts/upgrade-compose-api-budget.py scripts/upgrade-compose-runtime-hardening.py scripts/visual_matching_v4_compose.py
          cp shorts-compose/compose.js /tmp/compose_final.js
          cp shorts-compose/brollResolver.js /tmp/broll_final.js
          python3 scripts/upgrade-compose-creative-system.py /tmp/compose_final.js
          python3 scripts/upgrade-compose-api-budget.py /tmp/compose_final.js /tmp/broll_final.js
          python3 scripts/upgrade-compose-runtime-hardening.py /tmp/broll_final.js
          python3 scripts/visual_matching_v4_compose.py /tmp/compose_final.js
          grep -q 'VISUAL_MATCHING_V4' /tmp/broll_final.js
          grep -q 'localSemanticRerank' /tmp/broll_final.js
          grep -q 'sampleVideoContactSheet' /tmp/broll_final.js
          grep -q 'best_frame_indices' /tmp/broll_final.js
          grep -q 'verifiedRangeFromFrameIndices' /tmp/broll_final.js
          grep -q 'materializeVerifiedClip' /tmp/broll_final.js
          grep -q 'materializeVerifiedImage' /tmp/broll_final.js
          grep -q 'contract.visual_claim' /tmp/broll_final.js
          grep -q 'fromPixabayVideos' /tmp/broll_final.js
          grep -q 'fromWikimediaCommons' /tmp/broll_final.js
          ! grep -q 'best_start_sec' /tmp/broll_final.js
          ! grep -q 'best_end_sec' /tmp/broll_final.js
          grep -q 'VISUAL_MATCHING_V4_COMPOSE' /tmp/compose_final.js
          grep -q 'reviewFinalVideo' /tmp/compose_final.js
          grep -q 'Final visual QA rejected' /tmp/compose_final.js
          for marker in 'MapVisual' 'TimelineVisual' 'DiagramVisual' 'AnnotatedReal' '"map", "timeline", "diagram", "annotated_real"'; do grep -q "$marker" /tmp/compose_final.js; done
          grep -q '"-ar", "48000", "-ac", "2"' /tmp/compose_final.js
          ! grep -q 'const target = subj ||' /tmp/broll_final.js
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' shorts-compose/visualBudget.js
          for f in shorts-compose/remotion/src/compositions/MapVisual.tsx shorts-compose/remotion/src/compositions/TimelineVisual.tsx shorts-compose/remotion/src/compositions/DiagramVisual.tsx shorts-compose/remotion/src/compositions/AnnotatedReal.tsx; do test -s "$f"; done
          grep -q 'id="MapVisual"' shorts-compose/remotion/src/Root.tsx
          grep -q 'id="TimelineVisual"' shorts-compose/remotion/src/Root.tsx
          grep -q 'id="DiagramVisual"' shorts-compose/remotion/src/Root.tsx
          grep -q 'id="AnnotatedReal"' shorts-compose/remotion/src/Root.tsx
          node --check /tmp/compose_final.js
          node --check /tmp/broll_final.js
          node --check shorts-compose/visualContract.js
          node --check shorts-compose/visualBudget.js
          node --check shorts-compose/semanticReranker.js
          node --check shorts-compose/clipLibrary.js
          node --check shorts-compose/finalVisualQa.js

      - name: Provision production media runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install production-equivalent Node and Remotion dependencies
        run: |
          set -euo pipefail
          cd shorts-compose
          npm install --no-package-lock --no-audit --no-fund
          node - <<'NODE'
          const fs = require('fs');
          const p = require('ffmpeg-static');
          const real = fs.realpathSync(p);
          if (real !== '/usr/bin/ffmpeg') throw new Error(`ffmpeg-static path did not select system FFmpeg: ${real}`);
          console.log(`FFmpeg runtime OK: ${p} -> ${real}`);
          NODE
          npm --prefix remotion install --no-package-lock --no-audit --no-fund
          cd remotion
          RSPACK_VER="$(node -p "require('@rspack/binding/package.json').version")"
          npm install --no-package-lock --no-audit --no-fund --no-save "@rspack/binding-linux-x64-gnu@${RSPACK_VER}"
          node -e "require('@rspack/binding'); console.log('rspack binding OK')"

      - name: Run resolver and render regression tests on deploy artifacts
        env:
          CREATIVE_SYSTEM_EXPECT_PREFLIGHT: 'true'
        run: |
          set -euo pipefail
          # The deployment path transforms compose/resolver before Docker build.
          # Run media regressions against those exact artifacts, not the readable
          # canonical sources, or CI can be green while production differs.
          cp /tmp/compose_final.js shorts-compose/compose.js
          cp /tmp/broll_final.js shorts-compose/brollResolver.js
          cd shorts-compose
          node --check compose.js
          node --check brollResolver.js
          npm test

      - name: Run comprehensive pre-production audit
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py
