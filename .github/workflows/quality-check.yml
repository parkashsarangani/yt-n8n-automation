name: Validate Viral Shorts Quality Upgrade

on:
  pull_request:
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - '.github/workflows/quality-check.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - '.github/workflows/quality-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply quality upgrade to real workflow
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-viral-shorts.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_quality.json
          python3 -m json.tool /tmp/workflow_quality.json >/dev/null

      - name: Assert graph and editorial gates
        run: |
          set -euo pipefail
          grep -q 'VIRAL_QUALITY_V2' /tmp/workflow_quality.json
          grep -q 'Wikipedia: Research Topic' /tmp/workflow_quality.json
          grep -q 'Normalize Research Evidence' /tmp/workflow_quality.json
          grep -q 'qualityMinimums' /tmp/workflow_quality.json
          grep -q 'first_frame_strength' /tmp/workflow_quality.json
          grep -q 'shareability' /tmp/workflow_quality.json

      - name: Verify research path reaches writer
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_quality.json'))
          c = w['connections']
          assert any(e['node'] == 'Wikipedia: Research Topic' for e in c['Extract Generated Topic']['main'][0])
          assert c['Wikipedia: Research Topic']['main'][0][0]['node'] == 'Normalize Research Evidence'
          assert c['Normalize Research Evidence']['main'][0][0]['node'] == 'Claude: Draft Script (Stage 1)'
          print('research path OK')
          PY
