name: Validate Shorts Creative System V3

on:
  pull_request:
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - 'scripts/upgrade-creative-system-v3.py'
      - 'scripts/upgrade-compose-v3.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/feedbackLoop.js'
      - 'shorts-compose/competitorMining.js'
      - 'shorts-compose/channel-voice.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - 'scripts/upgrade-creative-system-v3.py'
      - 'scripts/upgrade-compose-v3.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/feedbackLoop.js'
      - 'shorts-compose/competitorMining.js'
      - 'shorts-compose/channel-voice.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply V2 + V3 workflow upgrades
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-viral-shorts.py scripts/upgrade-creative-system-v3.py scripts/upgrade-compose-v3.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_v2.json
          python3 scripts/upgrade-creative-system-v3.py /tmp/workflow_v2.json /tmp/workflow_v3.json
          python3 -m json.tool /tmp/workflow_v3.json >/dev/null

      - name: Assert commissioning graph
        run: |
          set -euo pipefail
          grep -q 'VIRAL_QUALITY_V2' /tmp/workflow_v3.json
          grep -q 'CREATIVE_SYSTEM_V3' /tmp/workflow_v3.json
          grep -q 'Wikipedia: Research Topic' /tmp/workflow_v3.json
          grep -q 'Claude: Commission Topic Shortlist (V3)' /tmp/workflow_v3.json
          grep -q 'Claude: Visual Director (V3)' /tmp/workflow_v3.json
          grep -q 'visual_plan_quality' /tmp/workflow_v3.json
          grep -q 'creative_dna' /tmp/workflow_v3.json
          grep -q 'search_queries' /tmp/workflow_v3.json

      - name: Verify V3 graph paths
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_v3.json'))
          c = w['connections']
          def first(src): return c[src]['main'][0][0]['node']
          assert first('Claude: Generate Topic') == 'Parse Topic Pool (V3)'
          assert first('Parse Topic Pool (V3)') == 'Claude: Commission Topic Shortlist (V3)'
          assert first('Claude: Commission Topic Shortlist (V3)') == 'Extract Generated Topic'
          assert any(e['node'] == 'Wikipedia: Research Topic' for e in c['Extract Generated Topic']['main'][0])
          assert first('Wikipedia: Research Topic') == 'Normalize Research Evidence'
          assert first('Normalize Research Evidence') == 'Claude: Draft Script (Stage 1)'
          assert first('Claude: Editorial Rewrite (Stage 2)') == 'Parse Editorial For Visual Director (V3)'
          assert first('Parse Editorial For Visual Director (V3)') == 'Claude: Visual Director (V3)'
          assert first('Claude: Visual Director (V3)') == 'Validate Final Script'
          names = {n['name']: n for n in w['nodes']}
          validate = names['Validate Final Script']['parameters']['jsCode']
          assert 'visual_plan_quality' in validate
          assert 'engagement_mode' in validate and "'none'" in validate
          resolver = names['Resolve B-roll']['parameters']['jsonBody']
          assert 'search_queries' in resolver and 'first_frame' in resolver
          print('V3 graph OK')
          PY

      - name: Validate compose and service source
        run: |
          set -euo pipefail
          python3 scripts/upgrade-compose-v3.py shorts-compose/compose.js /tmp/compose_v3.js
          grep -q 'CREATIVE_SYSTEM_V3_COMPOSE' /tmp/compose_v3.js
          grep -q 'wantsShareOutro' /tmp/compose_v3.js
          grep -q 'captionMode' /tmp/compose_v3.js
          node --check /tmp/compose_v3.js
          node --check shorts-compose/brollResolver.js
          node --check shorts-compose/feedbackLoop.js
          node --check shorts-compose/competitorMining.js
          python3 -m json.tool shorts-compose/channel-voice.json >/dev/null

      - name: Assert fail-closed b-roll
        run: |
          set -euo pipefail
          grep -q 'below_quality_threshold' shorts-compose/brollResolver.js
          grep -q 'BROLL_FIRST_FRAME_THRESHOLD' shorts-compose/brollResolver.js
          grep -q 'return { ok: false' shorts-compose/brollResolver.js
          grep -q 'visual_hook_proxy' shorts-compose/competitorMining.js
          grep -q 'creative_dna' shorts-compose/feedbackLoop.js
