name: Validate Shorts Creative System

on:
  pull_request:
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - 'scripts/upgrade-creative-system.py'
      - 'scripts/upgrade-compose-creative-system.py'
      - 'scripts/upgrade-compose-api-budget.py'
      - 'scripts/upgrade-compose-runtime-hardening.py'
      - 'scripts/upgrade-workflow-api-budget.py'
      - 'scripts/upgrade-topic-latency.py'
      - 'scripts/upgrade_quality_alignment.py'
      - 'scripts/upgrade-anthropic-parser.py'
      - 'scripts/preprod-audit.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/feedbackLoop.js'
      - 'shorts-compose/competitorMining.js'
      - 'shorts-compose/channel-voice.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'
  push:
    branches:
      - 'agent/**'
    paths:
      - 'n8n/workflow.json'
      - 'scripts/upgrade-viral-shorts.py'
      - 'scripts/upgrade-creative-system.py'
      - 'scripts/upgrade-compose-creative-system.py'
      - 'scripts/upgrade-compose-api-budget.py'
      - 'scripts/upgrade-compose-runtime-hardening.py'
      - 'scripts/upgrade-workflow-api-budget.py'
      - 'scripts/upgrade-topic-latency.py'
      - 'scripts/upgrade_quality_alignment.py'
      - 'scripts/upgrade-anthropic-parser.py'
      - 'scripts/preprod-audit.py'
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/feedbackLoop.js'
      - 'shorts-compose/competitorMining.js'
      - 'shorts-compose/channel-voice.json'
      - '.github/workflows/quality-check.yml'
      - '.github/workflows/deploy.yml'
      - 'docker-compose.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply workflow upgrades
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-viral-shorts.py scripts/upgrade-creative-system.py scripts/upgrade-workflow-api-budget.py scripts/upgrade-topic-latency.py scripts/upgrade_quality_alignment.py scripts/upgrade-anthropic-parser.py scripts/preprod-audit.py
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/workflow_quality_gate.json
          python3 scripts/upgrade-creative-system.py /tmp/workflow_quality_gate.json /tmp/workflow_creative_system.json
          python3 scripts/upgrade-workflow-api-budget.py /tmp/workflow_creative_system.json /tmp/workflow_api_budget.json
          python3 scripts/upgrade-topic-latency.py /tmp/workflow_api_budget.json /tmp/workflow_topic_latency.json
          python3 scripts/upgrade-anthropic-parser.py /tmp/workflow_topic_latency.json /tmp/workflow_final.json
          python3 -m json.tool /tmp/workflow_final.json >/dev/null

      - name: Verify graph, latency, retries, and response parsing
        run: |
          python3 - <<'PY'
          import json
          w = json.load(open('/tmp/workflow_final.json'))
          c = w['connections']
          def first(src): return c[src]['main'][0][0]['node']
          assert first('Claude: Generate Topic') == 'Parse Topic Pool'
          assert first('Parse Topic Pool') == 'Claude: Commission Topic Shortlist'
          assert first('Claude: Commission Topic Shortlist') == 'Extract Generated Topic'
          assert any(e['node'] == 'Wikipedia: Research Topic' for e in c['Extract Generated Topic']['main'][0])
          assert first('Wikipedia: Research Topic') == 'Normalize Research Evidence'
          assert first('Normalize Research Evidence') == 'Claude: Draft Script (Stage 1)'
          assert first('Claude: Draft Script (Stage 1)') == 'Parse Draft JSON'
          assert first('Parse Draft JSON') == 'Claude: Visual Director'
          assert first('Claude: Visual Director') == 'Validate Final Script'

          names = {n['name']: n for n in w['nodes']}
          assert 'Claude: Editorial Rewrite (Stage 2)' not in names, 'Editorial Rewrite stage should have been removed'
          assert 'Parse Editorial For Visual Director' not in names, 'Editorial parser node should have been removed'
          topic = names['Claude: Generate Topic']
          topic_body = topic['parameters']['jsonBody']
          assert 'TOPIC_LATENCY' in topic_body
          assert 'GENERATE 4 DISTINCT candidate topics' in topic_body
          assert 'max_tokens: 6000' in topic_body
          assert topic['parameters']['options']['timeout'] == 120000
          assert topic.get('retryOnFail') is False and topic.get('maxTries') == 1

          commission = names['Claude: Commission Topic Shortlist']
          assert commission['parameters']['options']['timeout'] == 120000
          assert commission.get('retryOnFail') is False and commission.get('maxTries') == 1
          assert 'shortlist:pool.slice(0,4)' in names['Parse Topic Pool']['parameters']['jsCode']

          visual = names['Claude: Visual Director']
          assert visual['parameters']['options']['timeout'] == 180000
          assert visual.get('retryOnFail') is False and visual.get('maxTries') == 1
          assert 'thinking: { type: "disabled" }' in visual['parameters']['jsonBody']
          assert names['Resolve B-roll']['parameters']['options']['timeout'] == 180000

          for node_name in ['Parse Topic Pool', 'Extract Generated Topic', 'Parse Draft JSON', 'Validate Final Script']:
              code = names[node_name]['parameters']['jsCode']
              assert 'ANTHROPIC_TEXT_BLOCK_GUARD' in code, node_name
              assert 'LAST_VALID_JSON_OBJECT' in code, node_name
              assert 'content?.[0]?.text' not in code, node_name
              assert 'stop_reason' in code, node_name

          writer_body = names['Claude: Draft Script (Stage 1)']['parameters']['jsonBody']
          assert 'Concept archetype' in writer_body
          validate = names['Validate Final Script']['parameters']['jsCode']
          assert 'visual_plan_quality' in validate
          assert 'needs at least 3 search_queries' in validate
          assert 'rebuiltFullScript' in validate
          resolver = names['Resolve B-roll']['parameters']['jsonBody']
          assert 'search_queries' in resolver and 'first_frame' in resolver
          assert 'run_id' in resolver and '$execution.id' in resolver
          print('Graph + runtime + Anthropic parser hardening OK')
          PY

      - name: Execute parser nodes against synthetic Claude responses
        run: |
          set -euo pipefail
          node - <<'JS'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('/tmp/workflow_final.json', 'utf8'));
          const names = {};
          for (const n of wf.nodes) names[n.name] = n;

          function run(nodeName, input, prior = {}) {
            const fn = new Function('$input', '$', '$execution', names[nodeName].parameters.jsCode);
            const $ = (name) => ({ item: { json: prior[name] || {} } });
            return fn({ first: () => ({ json: input }) }, $, { id: 'ci-exec' });
          }
          function assertItem(result, label) {
            if (result === undefined || result === null) throw new Error(label + ': node returned ' + result);
            if (Array.isArray(result)) {
              if (!result.every((x) => x && typeof x === 'object')) throw new Error(label + ': array items must be objects');
            } else if (typeof result !== 'object') {
              throw new Error(label + ': must return an object or array of objects, got ' + typeof result);
            }
          }

          const candidates = Array.from({ length: 4 }, (_, i) => ({
            topic: 'recognizable topic ' + i, archetype: 'looks_fake_but_real', research_query: 'q', first_frame_concept: 'f',
            share_reason: 's', evidence_score: 80, visual_score: 80, share_score: 80, reason: 'r', score: 80,
          }));
          assertItem(run('Parse Topic Pool', { content: [{ type: 'text', text: JSON.stringify({ candidates }) }], stop_reason: 'end_turn' }), 'Parse Topic Pool happy path');

          const script = { hook: 'a complete hook', scenes: [{ scene_index: 0, point: 'point', narration: 'enough narration' }] };
          const draft = run('Parse Draft JSON', { content: [{ type: 'text', text: JSON.stringify(script) }], stop_reason: 'end_turn' });
          assertItem(draft, 'Parse Draft JSON happy path');
          if (!draft || !draft.json || !draft.json.draft) throw new Error('Parse Draft JSON did not return {json:{draft}}');

          const draftCorrected = run('Parse Draft JSON', {
            content: [{ type: 'text', text: '{"hook":"bad",]\nWait\n' + JSON.stringify(script) }], stop_reason: 'end_turn'
          });
          if (draftCorrected.json.draft.hook !== script.hook) throw new Error('Draft parser did not choose final corrected JSON');

          console.log('Executable parser smoke tests OK');
          JS

      - name: Validate compose and b-roll runtime transforms
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/upgrade-compose-creative-system.py scripts/upgrade-compose-api-budget.py scripts/upgrade-compose-runtime-hardening.py
          cp shorts-compose/compose.js /tmp/compose_final.js
          cp shorts-compose/brollResolver.js /tmp/broll_final.js
          python3 scripts/upgrade-compose-creative-system.py /tmp/compose_final.js
          python3 scripts/upgrade-compose-api-budget.py /tmp/compose_final.js /tmp/broll_final.js
          python3 scripts/upgrade-compose-runtime-hardening.py /tmp/broll_final.js
          grep -q 'CREATIVE_SYSTEM_COMPOSE' /tmp/compose_final.js
          grep -q 'API_BUDGET_COMPOSE' /tmp/compose_final.js
          grep -q 'run_id' /tmp/compose_final.js
          grep -q 'API_BUDGET' /tmp/broll_final.js
          grep -q 'PREPROD_BROLL_HARDENING' /tmp/broll_final.js
          grep -q 'INITIAL_SEARCH_QUERIES' /tmp/broll_final.js
          grep -q 'FIRST_FRAME_MAX_VISION_CALLS' /tmp/broll_final.js
          grep -q 'SUPPORT_MAX_VISION_CALLS' /tmp/broll_final.js
          grep -q 'RUN_MAX_VISION_CALLS' /tmp/broll_final.js
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' /tmp/broll_final.js
          grep -q 'scoreCache' /tmp/broll_final.js
          grep -q 'runBudgets' /tmp/broll_final.js
          grep -q 'scoreOneBatch' /tmp/broll_final.js
          grep -q 'scene_vision_budget_exhausted' /tmp/broll_final.js
          grep -q 'run_vision_budget_exhausted' /tmp/broll_final.js
          node --check /tmp/compose_final.js
          node --check /tmp/broll_final.js
          node --check shorts-compose/feedbackLoop.js
          node --check shorts-compose/competitorMining.js
          python3 -m json.tool shorts-compose/channel-voice.json >/dev/null

      - name: Assert fail-closed quality behavior survives
        run: |
          set -euo pipefail
          grep -q 'below_quality_threshold' /tmp/broll_final.js
          grep -q 'BROLL_FIRST_FRAME_THRESHOLD' /tmp/broll_final.js
          grep -q 'return { ok: false' /tmp/broll_final.js
          grep -q 'visual_hook_proxy' shorts-compose/competitorMining.js
          grep -q 'creative_dna' shorts-compose/feedbackLoop.js

      - name: Run comprehensive pre-production audit
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py
