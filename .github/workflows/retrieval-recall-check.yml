name: Validate Retrieval Recall V5

on:
  pull_request:
    paths:
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/semanticReranker.js'
      - 'shorts-compose/clipLibrary.js'
      - 'shorts-compose/visualBudget.js'
      - 'scripts/build_production_artifacts.py'
      - 'scripts/resolver_v5_runtime.py'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/retrieval-recall-check.yml'
  push:
    branches: ['agent/**']

jobs:
  retrieval-recall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build authoritative production artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/retrieval-production
          python3 scripts/build_production_artifacts.py --output-dir /tmp/retrieval-production

      - name: Verify generated workflow semantic source contract
        run: |
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/retrieval-production/workflow.json')); names={n['name']:n for n in w['nodes']}
          visual=names['Claude: Visual Director']['parameters']['jsonBody']; validator=names['Validate Final Script']['parameters']['jsCode']; resolver=names['Resolve B-roll']['parameters']['jsonBody']
          assert 'VISUAL_MATCHING_V4' in visual
          for f in ['visual_claim','required_entities','required_actions','required_relationships','forbidden_visuals','visual_proof_mode']:
              assert f in visual and f in resolver,f
          assert 'VISUAL_MATCHING_V4 contract gate' in validator
          assert 'Do NOT request callout boxes' in visual
          assert names['Resolve B-roll']['parameters']['url'].startswith('http://shorts-compose:4000/')
          print('V5 workflow source contract OK')
          PY

      - name: Verify bounded multi-source best-available resolver
        run: |
          set -euo pipefail
          B=/tmp/retrieval-production/brollResolver.js
          for marker in VISUAL_MATCHING_V4 RETRIEVAL_RECALL_PHASE2 SOURCE_QUERY_COMPILER_V1 fromPexelsVideos fromPixabayVideos fromPixabayPhotos fromWikimediaCommons CANDIDATE_POOL_MAX localSemanticRerank diversifyCandidates candidatePassesGate deterministic_template_fallback RESOLVER_V5_RUNTIME V5_VIDEO_SAMPLE_STAGING V5_ALWAYS_PUBLISH_BEST_AVAILABLE best_available_below_quality_target no_technically_usable_candidate quality_gate_passed selection_reason; do grep -q "$marker" "$B"; done
          ! grep -q 'V5_PROOF_MEDIA_TYPE_FILTER' "$B"
          ! grep -q 'reason: state.budget_exhausted || "below_semantic_quality_gate"' "$B"
          ! grep -q 'annotation_plan' "$B"
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' shorts-compose/visualBudget.js
          grep -q 'durable_state: true' shorts-compose/visualBudget.js
          node --check "$B"
          node --check shorts-compose/semanticReranker.js
          node --check shorts-compose/clipLibrary.js

      - name: Verify production configuration
        run: |
          set -euo pipefail
          grep -q 'PIXABAY_KEY=${PIXABAY_KEY:-}' docker-compose.yml
          grep -q 'BROLL_RUN_MAX_VISION_CALLS=${BROLL_RUN_MAX_VISION_CALLS:-28}' docker-compose.yml
          grep -q 'BROLL_BUDGET_STATE_PATH=${BROLL_BUDGET_STATE_PATH:-/app/data/visual_budget_state.json}' docker-compose.yml
          grep -q 'PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}' .github/workflows/deploy.yml

      - name: Run full production preflight
        run: python3 scripts/preprod-audit.py