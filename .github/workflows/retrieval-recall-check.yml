name: Validate Retrieval Recall V4

on:
  pull_request:
    paths:
      - 'shorts-compose/brollResolver.js'
      - 'shorts-compose/semanticReranker.js'
      - 'shorts-compose/clipLibrary.js'
      - 'scripts/visual_matching_v4_workflow.py'
      - 'scripts/upgrade-compose-runtime-hardening.py'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/retrieval-recall-check.yml'
  push:
    branches: ['agent/**']

jobs:
  retrieval-recall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated workflow semantic source contract
        run: |
          set -euo pipefail
          python3 scripts/upgrade-viral-shorts.py n8n/workflow.json /tmp/t1.json
          python3 scripts/upgrade-creative-system.py /tmp/t1.json /tmp/t2.json
          python3 scripts/visual_matching_v4_workflow.py /tmp/t2.json /tmp/t2v4.json
          python3 scripts/upgrade-workflow-api-budget.py /tmp/t2v4.json /tmp/t3.json
          python3 scripts/upgrade-topic-latency.py /tmp/t3.json /tmp/t4.json
          python3 scripts/upgrade-anthropic-parser.py /tmp/t4.json /tmp/final.json
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/final.json')); names={n['name']:n for n in w['nodes']}
          visual=names['Claude: Visual Director']['parameters']['jsonBody']; validator=names['Validate Final Script']['parameters']['jsCode']; resolver=names['Resolve B-roll']['parameters']['jsonBody']
          assert 'VISUAL_MATCHING_V4' in visual
          for f in ['visual_claim','required_entities','required_actions','required_relationships','forbidden_visuals','visual_proof_mode']:
              assert f in visual and f in resolver,f
          assert 'VISUAL_MATCHING_V4 contract gate' in validator
          print('V4 workflow source contract OK')
          PY

      - name: Verify bounded multi-source resolver
        run: |
          set -euo pipefail
          cp shorts-compose/compose.js /tmp/compose.js
          cp shorts-compose/brollResolver.js /tmp/broll.js
          python3 scripts/upgrade-compose-creative-system.py /tmp/compose.js
          python3 scripts/upgrade-compose-api-budget.py /tmp/compose.js /tmp/broll.js
          python3 scripts/upgrade-compose-runtime-hardening.py /tmp/broll.js
          for marker in VISUAL_MATCHING_V4 RETRIEVAL_RECALL_PHASE2 SOURCE_QUERY_COMPILER_V1 fromPexelsVideos fromPixabayVideos fromPixabayPhotos fromWikimediaCommons CANDIDATE_POOL_MAX localSemanticRerank diversifyCandidates; do grep -q "$marker" /tmp/broll.js; done
          grep -q 'BROLL_RUN_MAX_VISION_CALLS || 28' shorts-compose/visualBudget.js
          node --check /tmp/broll.js
          node --check shorts-compose/semanticReranker.js
          node --check shorts-compose/clipLibrary.js

      - name: Verify production configuration
        run: |
          set -euo pipefail
          grep -q 'PIXABAY_KEY=${PIXABAY_KEY:-}' docker-compose.yml
          grep -q 'BROLL_RUN_MAX_VISION_CALLS=${BROLL_RUN_MAX_VISION_CALLS:-28}' docker-compose.yml
          grep -q 'PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}' .github/workflows/deploy.yml

      - name: Run full production preflight
        run: |
          set -euo pipefail
          python3 scripts/preprod-audit.py
